name: Rust CI (engine)

# 轻量编译/测试闸门：只验证 Rust 代码，不构建 APK。
# 本地无 Rust 工具链，所有编译验证都在这里跑。
on:
  push:
    paths:
      - "apps/coomi-rs/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "apps/coomi-rs/**"
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/coomi-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 APK 构建工作流保持一致的工具链版本，避免版本漂移。
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/coomi-rs

      - name: Format check (informational)
        # 仓库历史代码存在 rustfmt 未覆盖的格式，这里只做提示，不阻塞 CI。
        # 硬阻塞会让 V6.1 的编译/测试验证被无关的历史格式问题挡住。
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy (engine, informational)
        # 仓库历史代码有大量 clippy 告警（workflow_runner 等），不是本次改动引入。
        # 只做提示，不阻塞；真正的硬闸门是下面的 cargo test（它必须先编译通过）。
        run: cargo clippy -p coomi-engine --all-targets
        continue-on-error: true

      # 硬闸门：cargo test 会先编译整个 engine，编译失败即红。
      # --locked 与 build.gradle:319 的 APK 构建保持一致：CI 必须使用仓库里已提交的
      # Cargo.lock 验证，而不是就地生成一个新的。此前不带 --locked，cargo 会自动补写
      # lock 文件，导致「加了依赖但没同步 Cargo.lock」在本闸门全绿，却让 APK 构建失败。
      - name: Test (engine)
        run: cargo test --locked -p coomi-engine

      # 覆盖闸门：上面的 cargo test 只编译 engine。tools/ui/security 等 crate 的改动
      # （例如 lifecycle_ack、with_turn_delivery 调用）不在 engine 的依赖图里，
      # 只跑 -p coomi-engine 会「改了但没编译」却仍然全绿。用 workspace 检查堵住。
      - name: Check (workspace)
        run: cargo check --locked --workspace --all-targets
